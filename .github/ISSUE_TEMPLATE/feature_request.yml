name: Request a feature
description: Describe a feature as an actionable task.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and goal
      description: What do you want to achieve, and what is missing today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior
      description: Provide specific UI or API examples.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List verifiable conditions that the implementation must meet.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope, limitations, and alternatives
      description: What is in scope, what can wait, and does existing data need to be migrated?
