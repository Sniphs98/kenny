name: Report a bug
description: Describe a reproducible bug.
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the initial state and specific steps; omit tokens and private data.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Container version, browser, and operating system
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How can we verify that the bug is fixed?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
