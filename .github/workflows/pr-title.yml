name: PR title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check title without evaluating issue text as shell code
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          node -e "if (!/^(feat|fix|docs|refactor|test|chore|perf|ci)(\([a-zA-Z0-9_.\/-]+\))?!?: .+/.test(process.env.PR_TITLE)) { console.error('Use a Conventional Commit title, e.g. feat(tickets): add filtering'); process.exit(1); }"
